[build-system]
requires = ["flit_core >=4.0.2,<5"]
build-backend = "flit_core.buildapi"

[project]
name = "mdformat_footnote"
authors = [
    {name = "Gaige B. Paulsen", email = "gaige@cluetrust.com"},
]
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Environment :: Plugins",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["mdformat", "markdown", "markdown-it"]
dependencies = [
    "mdformat >=0.7.0",
    "mdit-py-plugins >=0.4.0",
]

[project.urls]
Home = "https://github.com/gaige/mdformat-footnote"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=7.0.0",
]
dev = ["pre-commit"]

[project.entry-points."mdformat.parser_extension"]
footnote = "mdformat_footnote"

[tool.flit.sdist]
include = []
exclude = [".github/", "tests/"]

[tool.isort]
# Force imports to be sorted by module, independent of import type
force_sort_within_sections = true
# Group first party and local folder imports together
no_lines_before = ["LOCALFOLDER"]

# Configure isort to work without access to site-packages
known_first_party = ["mdformat_footnote", "tests"]

# Settings for Black compatibility
profile = "black"
